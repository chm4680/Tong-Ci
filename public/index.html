<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>同词相遇</title>
<style>
:root { --bg:#f5f6fa; --card:#fff; --primary:#4f6ef7; --text:#1f2430; --muted:#7a8194; --ok:#2fb56b; --danger:#e5484d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
#app { max-width: 540px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { text-align:center; margin: 16px 0 4px; font-size: 30px; }
.sub { text-align:center; color:var(--muted); margin: 0 0 18px; }
.card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(31,36,48,.06); }
h2 { margin: 0 0 10px; font-size: 20px; text-align:center; }
h3 { margin: 0 0 8px; font-size: 16px; }
label { display:block; font-size:14px; color:var(--muted); margin: 10px 0 6px; }
input[type=text], input[type=number], input:not([type]) { width:100%; padding: 12px; font-size:16px; border:1px solid #d8dce6; border-radius:10px; outline:none; background:#fff; color:var(--text); }
input:focus { border-color: var(--primary); }
button { display:block; width:100%; padding:13px; font-size:16px; border:0; border-radius:10px; background:#e8ecf7; color:var(--text); margin-top:10px; cursor:pointer; }
button.primary { background:var(--primary); color:#fff; font-weight:600; }
button.small { font-size:14px; padding:9px 14px; width:auto; margin: 10px auto 0; display:block; }
button:disabled { opacity:.5; }
.hidden { display:none !important; }
.divider { text-align:center; color:var(--muted); font-size:13px; margin: 16px 0 4px; }
.rules { font-size:14px; color:var(--muted); line-height: 1.7; }
.rules b { color: var(--text); }
.room-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; }
.room-head .label { color:var(--muted); font-size:14px; }
#codeLabel { font-size:26px; font-weight:700; letter-spacing:5px; color:var(--primary); }
#copyBtn { display:inline-block; width:auto; padding:6px 12px; font-size:13px; margin:0 0 0 8px; background:#e8ecf7; border-radius:8px; }
#connBanner { background:#ffe9e9; color:#c0392b; padding:8px 12px; border-radius:10px; margin-bottom:12px; font-size:14px; text-align:center; }
.players { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.player-chip { display:flex; flex-direction:column; align-items:center; background:var(--card); border-radius:10px; padding:8px 12px; min-width:76px; box-shadow: 0 2px 6px rgba(31,36,48,.06); }
.player-chip .name { font-weight:600; font-size:15px; word-break: break-all; }
.player-chip .tag { font-size:12px; color:var(--muted); margin-top:2px; }
.player-chip.me { outline: 2px solid var(--primary); }
.player-chip .score { font-size:12px; color:var(--primary); font-weight:600; }
.countdown { font-size:60px; font-weight:700; text-align:center; font-variant-numeric: tabular-nums; margin: 8px 0; }
.countdown.warn { color: var(--danger); }
.round-label { text-align:center; color:var(--muted); }
.hint { color:var(--muted); font-size:14px; text-align:center; margin:8px 0; }
.refwords { background:#f2f4fb; border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:15px; line-height:1.8; }
.refwords .t { color:var(--muted); font-size:13px; display:block; }
.refwords b { color: var(--primary); }
.reveal-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
.reveal-card { background:#f2f4fb; border-radius:12px; padding:12px 10px; text-align:center; }
.reveal-card .who { font-size:13px; color:var(--muted); }
.reveal-card .w { font-size:20px; font-weight:700; margin-top:6px; word-break: break-all; }
.reveal-card .w.miss { color:var(--muted); font-weight:400; }
.banner { text-align:center; font-size:22px; font-weight:700; color:var(--ok); margin: 6px 0; }
.breakdown { background:#f2f4fb; border-radius:10px; padding:10px 14px; font-size:14px; line-height:1.9; margin-top:12px; }
.breakdown .row { display:flex; justify-content:space-between; }
table.lb { width:100%; border-collapse: collapse; font-size:15px; }
table.lb td { padding:6px 4px; border-bottom:1px solid #eef0f5; }
table.lb .me { color: var(--primary); font-weight:600; }
#toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:rgba(31,36,48,.92); color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; z-index:99; max-width:85%; text-align:center; }
</style>
</head>
<body>
<div id="app">

  <section id="home">
    <h1>同词相遇</h1>
    <p class="sub">和朋友们一起联想，直到所有人想到同一个词</p>
    <div class="card">
      <label>你的昵称</label>
      <input id="nameInput" maxlength="12" placeholder="输入昵称">
      <button id="createBtn" class="primary">创建房间</button>
      <div class="divider">或</div>
      <label>加入朋友的房间</label>
      <input id="codeInput" maxlength="4" placeholder="4位房间码" style="text-transform:uppercase">
      <button id="joinBtn">加入房间</button>
    </div>
    <div class="card rules">
      <b>玩法</b><br>
      1. 每人输入一个初始词，全部提交后展示给所有人<br>
      2. 倒计时内，每人根据上一轮展示的所有词，联想一个新词（本轮内可修改）<br>
      3. 倒计时结束，展示所有人的词<br>
      4. 重复联想，直到<b>所有人想到完全相同的词</b>，游戏结束<br><br>
      <b>积分</b><br>
      每完成一轮 +10 分；相遇成功 +50 分；越早相遇速度奖励越高（第1轮 +90，第2轮 +80……第10轮起 0）
    </div>
  </section>

  <section id="room" class="hidden">
    <div class="room-head">
      <span class="label">房间码</span>
      <span><span id="codeLabel"></span><button id="copyBtn">复制</button></span>
    </div>
    <div id="connBanner" class="hidden">连接断开，正在重连…</div>
    <div id="playerList" class="players"></div>

    <div id="phaseLobby" class="card hidden">
      <h2>等待玩家加入</h2>
      <p id="lobbyInfo" class="hint"></p>
      <div id="hostSettings" class="hidden">
        <label>首轮倒计时（秒）</label>
        <input id="tFirst" type="number" min="5" max="600" value="60">
        <label>之后每轮倒计时（秒）</label>
        <input id="tNext" type="number" min="5" max="600" value="60">
      </div>
      <button id="startBtn" class="primary hidden">开始游戏</button>
    </div>

    <div id="phaseInitial" class="card hidden">
      <h2>想一个初始词</h2>
      <p id="initialProgress" class="hint"></p>
      <div id="initialInputBox">
        <input id="initialWordInput" maxlength="50" placeholder="输入你的初始词">
        <button id="initialSubmitBtn" class="primary">提交初始词</button>
      </div>
      <div id="initialDoneBox" class="hidden">
        <p class="hint">已提交，等待其他人…</p>
      </div>
      <button id="forceStartBtn" class="small hidden">跳过等待，直接开始</button>
    </div>

    <div id="phaseRound" class="card hidden">
      <div class="round-label">第 <b id="roundNo"></b> 轮</div>
      <div id="countdown" class="countdown">--</div>
      <div id="refwords" class="refwords hidden"></div>
      <div id="roundInputBox">
        <input id="roundWordInput" maxlength="50" placeholder="输入你联想到的词">
        <button id="roundSubmitBtn" class="primary">提交</button>
      </div>
      <div id="roundSpectatorBox" class="hidden">
        <p class="hint">你中途加入，本轮观战，下一轮开始参与</p>
      </div>
      <p id="roundSubmitState" class="hint"></p>
    </div>

    <div id="phaseReveal" class="card hidden">
      <div id="revealTitle" class="banner"></div>
      <div id="revealWords" class="reveal-grid"></div>
      <div id="scoreBreakdown" class="breakdown hidden"></div>
      <p id="revealNext" class="hint"></p>
      <button id="rematchBtn" class="primary hidden">再来一局</button>
    </div>

    <div class="card">
      <h3>积分榜</h3>
      <table class="lb"><tbody id="leaderboard"></tbody></table>
    </div>

    <button id="leaveBtn" class="small">退出房间</button>
  </section>

  <div id="toast" class="hidden"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws = null, state = null, myName = '', myCode = '', myPlayerId = null;
let manualLeave = false, autoRejoining = false, reconnectTimer = null, toastTimer = null, lastPhase = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host);
  ws.onopen = () => {
    $('connBanner').classList.add('hidden');
    if (myCode && myName) {
      autoRejoining = true;
      send({ type: 'join', code: myCode, name: myName });
    }
  };
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'joined') {
      autoRejoining = false;
      myCode = msg.code;
      myPlayerId = msg.playerId;
      localStorage.setItem('tc_code', msg.code);
    } else if (msg.type === 'state') {
      autoRejoining = false;
      render(msg.state);
    } else if (msg.type === 'error') {
      toast(msg.message);
      if (autoRejoining) {
        autoRejoining = false;
        manualLeave = true;
        myCode = '';
        localStorage.removeItem('tc_code');
        showHome();
        try { ws.close(); } catch (e) {}
        manualLeave = false;
        connect();
      }
    } else if (msg.type === 'kicked') {
      manualLeave = true;
      myCode = '';
      localStorage.removeItem('tc_code');
      toast('你已在其他设备加入了同一房间');
      showHome();
      try { ws.close(); } catch (e) {}
      manualLeave = false;
      connect();
    }
  };
  ws.onclose = () => {
    if (myCode && !manualLeave) {
      $('connBanner').classList.remove('hidden');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 2000);
    }
  };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
}

function showHome() {
  $('room').classList.add('hidden');
  $('home').classList.remove('hidden');
}

function render(s) {
  const phaseChanged = !state || state.phase !== s.phase;
  state = s;
  $('home').classList.add('hidden');
  $('room').classList.remove('hidden');
  $('codeLabel').textContent = s.code;
  const me = s.players.find((p) => p.id === myPlayerId) || null;

  renderPlayers(s, me);
  for (const ph of ['lobby', 'initial', 'round', 'reveal']) {
    $('phase' + ph[0].toUpperCase() + ph.slice(1)).classList.toggle('hidden', s.phase !== ph);
  }
  if (s.phase === 'lobby') renderLobby(s, me);
  if (s.phase === 'initial') renderInitial(s, me);
  if (s.phase === 'round') renderRound(s, me);
  if (s.phase === 'reveal' || s.phase === 'ended') renderReveal(s);
  renderLeaderboard(s);

  if (phaseChanged && (s.phase === 'reveal' || s.phase === 'ended')) {
    beep();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  updateCountdown();
}

function renderPlayers(s, me) {
  const box = $('playerList');
  box.textContent = '';
  for (const p of s.players) {
    const chip = document.createElement('div');
    chip.className = 'player-chip' + (me && p.id === me.id ? ' me' : '');
    const n = document.createElement('span');
    n.className = 'name';
    n.textContent = p.name;
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = playerTag(s, p);
    const sc = document.createElement('span');
    sc.className = 'score';
    sc.textContent = p.score + '分';
    chip.appendChild(n);
    chip.appendChild(tag);
    chip.appendChild(sc);
    box.appendChild(chip);
  }
}

function playerTag(s, p) {
  if (!p.alive) return '已离开';
  if (s.phase === 'round' && !p.inRound) return '观战';
  if (p.submitted) return '已提交';
  if (s.phase === 'lobby') return '已就位';
  return '思考中';
}

function renderLobby(s, me) {
  const alive = s.players.filter((p) => p.alive).length;
  const isHost = me && me.id === s.hostId;
  $('lobbyInfo').textContent = '当前 ' + alive + ' 人（至少 2 人才能开始）';
  $('hostSettings').classList.toggle('hidden', !isHost);
  $('startBtn').classList.toggle('hidden', !isHost);
  $('startBtn').disabled = alive < 2;
}

function renderInitial(s, me) {
  if (!me) return;
  const alive = s.players.filter((p) => p.alive).length;
  $('initialProgress').textContent = '已提交 ' + s.submittedCount + '/' + alive;
  const submitted = me.submitted;
  $('initialInputBox').classList.toggle('hidden', submitted);
  $('initialDoneBox').classList.toggle('hidden', !submitted);
  $('forceStartBtn').classList.toggle('hidden', !(me.id === s.hostId && s.submittedCount < alive && s.submittedCount > 0));
}

function renderRound(s, me) {
  $('roundNo').textContent = s.round;
  const ref = s.round === 1 ? s.initialWords : s.lastWords;
  const refBox = $('refwords');
  if (ref) {
    refBox.classList.remove('hidden');
    refBox.textContent = '';
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = s.round === 1 ? '初始词：' : '上一轮：';
    refBox.appendChild(t);
    for (const w of ref) {
      const b = document.createElement('b');
      b.textContent = w.name + '「' + (w.word || '未提交') + '」 ';
      refBox.appendChild(b);
    }
  } else {
    refBox.classList.add('hidden');
  }
  if (!me) return;
  const inRound = me.inRound;
  $('roundInputBox').classList.toggle('hidden', !inRound);
  $('roundSpectatorBox').classList.toggle('hidden', inRound);
  $('roundSubmitState').textContent = inRound && me.submitted ? '已提交，倒计时结束前可修改' : '';
  $('roundSubmitBtn').textContent = me.submitted ? '修改' : '提交';
}

function renderReveal(s) {
  $('revealTitle').textContent = s.ended ? '相遇成功！' : '第 ' + s.round + ' 轮结果';
  const grid = $('revealWords');
  grid.textContent = '';
  for (const w of s.lastWords || []) {
    const c = document.createElement('div');
    c.className = 'reveal-card';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = w.name;
    const word = document.createElement('div');
    word.className = 'w' + (w.word ? '' : ' miss');
    word.textContent = w.word || '未提交';
    c.appendChild(who);
    c.appendChild(word);
    grid.appendChild(c);
  }
  const bd = $('scoreBreakdown');
  if (s.ended && s.scoreDelta) {
    bd.classList.remove('hidden');
    bd.textContent = '';
    const d = s.scoreDelta;
    const rows = [
      ['共同之词', '「' + d.word + '」'],
      ['完成 ' + s.round + ' 轮', '+' + d.perRound],
      ['相遇成功', '+' + d.win],
      ['速度奖励', '+' + d.speed],
      ['本局合计', '+' + d.total],
    ];
    for (const [k, v] of rows) {
      const row = document.createElement('div');
      row.className = 'row';
      const a = document.createElement('span');
      a.textContent = k;
      const b = document.createElement('span');
      b.textContent = v;
      row.appendChild(a);
      row.appendChild(b);
      bd.appendChild(row);
    }
  } else {
    bd.classList.add('hidden');
  }
  $('rematchBtn').classList.toggle('hidden', !s.ended);
}

function renderLeaderboard(s) {
  const tb = $('leaderboard');
  tb.textContent = '';
  s.leaderboard.forEach((e, i) => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td');
    td1.textContent = (i + 1) + '. ' + e.name;
    if (e.name === myName) td1.className = 'me';
    const td2 = document.createElement('td');
    td2.style.textAlign = 'right';
    td2.textContent = e.score + ' 分';
    if (e.name === myName) td2.className = 'me';
    tr.appendChild(td1);
    tr.appendChild(td2);
    tb.appendChild(tr);
  });
}

function updateCountdown() {
  if (!state) return;
  const el = $('countdown');
  if (state.phase === 'round') {
    const remain = Math.max(0, state.deadline - Date.now());
    el.textContent = Math.ceil(remain / 1000);
    el.classList.toggle('warn', remain > 0 && remain <= 10000);
  } else if (state.phase === 'reveal' && !state.ended && state.nextRoundAt) {
    const remain = Math.max(0, state.nextRoundAt - Date.now());
    $('revealNext').textContent = Math.ceil(remain / 1000) + ' 秒后自动开始第 ' + (state.round + 1) + ' 轮';
  } else {
    $('revealNext').textContent = '';
  }
}
setInterval(updateCountdown, 200);

let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.4);
  } catch (e) {}
}

// 按钮事件
$('createBtn').addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  myName = $('nameInput').value.trim() || ('玩家' + Math.floor(Math.random() * 900 + 100));
  localStorage.setItem('tc_name', myName);
  manualLeave = false;
  autoRejoining = false;
  myCode = '';
  send({ type: 'create', name: myName });
});
$('joinBtn').addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  myName = $('nameInput').value.trim();
  if (!myName) return toast('请先输入昵称');
  localStorage.setItem('tc_name', myName);
  const code = $('codeInput').value.trim().toUpperCase();
  if (!code) return toast('请输入房间码');
  manualLeave = false;
  autoRejoining = false;
  send({ type: 'join', code, name: myName });
});
$('codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });
$('copyBtn').addEventListener('click', () => {
  const code = state && state.code || '';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => toast('房间码已复制'), () => toast('复制失败，请手动记下：' + code));
  } else {
    toast('房间码：' + code);
  }
});
$('startBtn').addEventListener('click', () => {
  const t1 = Math.min(600, Math.max(10, Number($('tFirst').value) || 60));
  const t2 = Math.min(600, Math.max(10, Number($('tNext').value) || 60));
  send({ type: 'start', tFirst: t1, tNext: t2 });
});
$('initialSubmitBtn').addEventListener('click', () => {
  const w = $('initialWordInput').value.trim();
  if (!w) return toast('请先输入一个词');
  send({ type: 'submit', word: w });
});
$('initialWordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('initialSubmitBtn').click(); });
$('forceStartBtn').addEventListener('click', () => send({ type: 'forceStart' }));
$('roundSubmitBtn').addEventListener('click', () => {
  const w = $('roundWordInput').value.trim();
  if (!w) return toast('请先输入一个词');
  send({ type: 'submit', word: w });
});
$('roundWordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('roundSubmitBtn').click(); });
$('rematchBtn').addEventListener('click', () => send({ type: 'rematch' }));
$('leaveBtn').addEventListener('click', () => {
  manualLeave = true;
  myCode = '';
  localStorage.removeItem('tc_code');
  ws.close();
  showHome();
});

// 初始化：恢复昵称和房间，尝试自动重连
myName = localStorage.getItem('tc_name') || '';
$('nameInput').value = myName;
myCode = localStorage.getItem('tc_code') || '';
connect();
</script>
</body>
</html>
